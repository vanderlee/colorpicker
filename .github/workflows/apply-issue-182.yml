name: Apply issue 182 patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-issue-182
          fetch-depth: 0

      - name: Apply exact source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('jquery.colorpicker.js')
          source = path.read_text(encoding='utf-8')
          replacements = {
              "$('.ui-colorpicker-special-none', part)": "$('.ui-colorpicker-special-none:ui-button', part)",
              "$('.ui-colorpicker-special-transparent', part)": "$('.ui-colorpicker-special-transparent:ui-button', part)",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit('Expected selector exactly once: ' + old)
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/apply-issue-182.yml').unlink()
          PY

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jquery.colorpicker.js .github/workflows/apply-issue-182.yml
          git commit -m "Fix optional footer button refresh"
          git push origin HEAD:agent/fix-issue-182
