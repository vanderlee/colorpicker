name: Apply touch dragging fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/support-touch-dragging
          fetch-depth: 0

      - name: Apply exact source patch
        run: python3 tools/apply-touch-drag-fix.py

      - name: Validate JavaScript
        run: node --check jquery.colorpicker.js

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jquery.colorpicker.js .github/workflows/apply-touch-drag-fix.yml tools/apply-touch-drag-fix.py
          git commit -m "Support touch dragging"
          git push origin HEAD:agent/support-touch-dragging
